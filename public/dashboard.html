<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Receptionist Dashboard</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main class="dash">
    <h1 id="title">Dashboard</h1>
    <p class="muted">Everything the AI receptionist captured. Updates every 5 seconds.</p>
    <div class="stats">
      <div class="stat"><div class="n" id="n-booking">0</div><div class="label">Jobs booked</div></div>
      <div class="stat"><div class="n" id="n-lead">0</div><div class="label">Leads captured</div></div>
      <div class="stat"><div class="n" id="n-escalation">0</div><div class="label">Urgent alerts</div></div>
    </div>
    <div class="tabs" role="tablist">
      <button type="button" role="tab" id="tab-events" aria-selected="true">Actions</button>
      <button type="button" role="tab" id="tab-conversations" aria-selected="false">Conversations</button>
    </div>
    <div class="events" id="events"></div>
    <div class="events" id="conversations" hidden></div>
  </main>
  <script type="module">
    const params = new URLSearchParams(location.search);
    const slug = params.get("client") || "demo-hvac";
    const token = params.get("token") || "";
    const $ = (id) => document.getElementById(id);

    fetch(`/api/clients/${encodeURIComponent(slug)}`)
      .then((r) => (r.ok ? r.json() : null))
      .then((p) => {
        if (!p) return;
        $("title").textContent = `${p.business_name} · Receptionist dashboard`;
        document.documentElement.style.setProperty("--brand", p.brand_color || "#1f6feb");
      });

    const LABELS = { booking: "Booked job", lead: "Lead", escalation: "Urgent alert" };

    function render(events) {
      for (const type of Object.keys(LABELS)) {
        $(`n-${type}`).textContent = events.filter((e) => e.type === type).length;
      }
      const list = $("events");
      list.replaceChildren();
      if (!events.length) {
        const p = document.createElement("p");
        p.className = "muted";
        p.textContent = "Nothing yet. Start a conversation in the chat demo.";
        list.append(p);
      }
      for (const e of events) {
        const card = document.createElement("article");
        card.className = "event";
        const head = document.createElement("div");
        head.className = "event-head";
        const tag = document.createElement("span");
        tag.className = `tag ${e.type}`;
        tag.textContent = LABELS[e.type] || e.type;
        const when = document.createElement("span");
        when.className = "muted";
        when.style.margin = "0";
        when.textContent = `#${e.id} · ${new Date(e.at).toLocaleString()} · ${e.channel || "web"}`;
        head.append(tag, when);
        const dl = document.createElement("dl");
        for (const [k, v] of Object.entries(e.data || {})) {
          if (v === null || v === "") continue;
          const dt = document.createElement("dt");
          dt.textContent = k.replaceAll("_", " ");
          const dd = document.createElement("dd");
          dd.textContent = String(v);
          dl.append(dt, dd);
        }
        card.append(head, dl);
        list.append(card);
      }
    }

    function renderConversations(conversations) {
      const list = $("conversations");
      const open = new Set([...list.querySelectorAll("details[open]")].map((d) => d.dataset.id));
      list.replaceChildren();
      if (!conversations.length) {
        const p = document.createElement("p");
        p.className = "muted";
        p.textContent = "No conversations yet.";
        list.append(p);
      }
      for (const c of conversations) {
        const details = document.createElement("details");
        details.className = "event";
        details.dataset.id = c.session_id;
        details.open = open.has(c.session_id);
        const summary = document.createElement("summary");
        const first = c.messages.find((m) => m.role === "customer");
        summary.textContent = `${new Date(c.started_at).toLocaleString()} · ${c.channel} · ${c.messages.length} messages — ${first ? first.text.slice(0, 80) : ""}`;
        details.append(summary);
        const thread = document.createElement("div");
        thread.className = "thread";
        for (const m of c.messages) {
          const bubble = document.createElement("div");
          bubble.className = `msg ${m.role === "customer" ? "out" : "in"}${m.error ? " error" : ""}`;
          bubble.textContent = m.text;
          thread.append(bubble);
        }
        details.append(thread);
        list.append(details);
      }
    }

    async function refresh() {
      const q = `client=${encodeURIComponent(slug)}&token=${encodeURIComponent(token)}`;
      const [events, conversations] = await Promise.all([fetch(`/api/events?${q}`), fetch(`/api/conversations?${q}`)]);
      if (events.ok) render((await events.json()).events);
      else $("events").textContent = (await events.json()).error;
      if (conversations.ok) renderConversations((await conversations.json()).conversations);
    }

    for (const [tab, panel] of [["tab-events", "events"], ["tab-conversations", "conversations"]]) {
      $(tab).addEventListener("click", () => {
        for (const [t, p] of [["tab-events", "events"], ["tab-conversations", "conversations"]]) {
          $(t).setAttribute("aria-selected", String(t === tab));
          $(p).hidden = p !== panel;
        }
      });
    }
    refresh();
    setInterval(refresh, 5000);
  </script>
</body>
</html>
